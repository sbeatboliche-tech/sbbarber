<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SB Barber - Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --bg-color: #000000;
            --card-bg: #121212;
            --border-color: #27272a;
        }

        body {
            overflow: hidden;
            position: fixed; width: 100%; height: 100%;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
            background-color: var(--bg-color); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease-out;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .app-shell {
            display: flex; flex-direction: column; height: 100%;
            padding-top: var(--safe-area-top); opacity: 0; transition: opacity 0.5s ease-in;
        }

        /* 4 PASOS: contenedor 400%, cada paso 25% */
        .step-container {
            display: flex; width: 400%; height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform;
        }
        .step {
            width: 25%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 1.5rem; padding-bottom: 8rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type="text"], input[type="tel"] {
            font-size: 16px !important; background-color: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; color: white; width: 100%;
            -webkit-appearance: none; appearance: none;
        }
        input:focus { outline: none; border-color: white; }

        .selected-item {
            background-color: white !important; color: black !important; border-color: white !important;
            transform: scale(1.02);
        }

        button:active:not(:disabled) { opacity: 0.7; transform: scale(0.98); }

        .input-error { border-color: #ef4444 !important; }
        .input-error::placeholder { color: #ef4444; }

        #success-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem; text-align: center;
            opacity: 0; transition: opacity 0.4s ease-in;
        }
        #success-screen.visible { display: flex; opacity: 1; }

        @keyframes check-pop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .check-anim { animation: check-pop 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
    <link rel="stylesheet" href="../assets/sb-motion.css">
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <img src="https://i.imgur.com/xyjMT6X.png" alt="SB Barber" class="h-32 object-contain animate-pulse-soft mb-8" onerror="this.style.display='none'">
        <div class="w-8 h-8 border-4 border-zinc-800 border-t-white rounded-full animate-spin"></div>
    </div>

    <!-- APP SHELL -->
    <div id="app-shell" class="app-shell">
        <header class="bg-black border-b border-zinc-800 px-4 pt-4 pb-4 shrink-0 z-50">
            <div class="flex justify-center mb-4">
                <img src="https://i.imgur.com/xyjMT6X.png" alt="SB Barber Logo" class="h-10 object-contain" onerror="this.style.display='none'">
            </div>
            <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-white transition-all duration-300 ease-out" style="width: 25%;"></div>
            </div>
        </header>

        <main class="flex-grow overflow-hidden relative">
            <div id="main-slider" class="step-container">

                <!-- PASO 1 · BARBERO -->
                <section class="step" data-motion>
                    <h1 class="text-2xl font-bold mb-6 mt-2 tracking-wide">Elegí tu barbero</h1>
                    <div id="barber-list" class="grid grid-cols-1 gap-4"></div>
                </section>

                <!-- PASO 2 · SERVICIO -->
                <section class="step" data-motion>
                    <div class="flex items-center gap-2 mb-6 mt-2">
                        <button onclick="window.goToStep(1)" class="p-2 -ml-2 rounded-full active:bg-zinc-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h1 class="text-2xl font-bold tracking-wide">Elegí el servicio</h1>
                    </div>
                    <div id="service-list" class="grid grid-cols-1 gap-4"></div>

                    <!-- Pregunta pelo largo (suma 15 min al turno) -->
                    <div id="largo-box" class="hidden mt-6 bg-[#121212] border border-zinc-700 rounded-2xl p-5">
                        <p class="text-lg font-bold mb-1">¿Tenés el pelo largo?</p>
                        <p class="text-sm text-zinc-400 mb-4">Así te reservamos el tiempo justo.</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="window.elegirLargo(false)" class="bg-black border border-zinc-700 rounded-xl py-3.5 font-bold">No</button>
                            <button onclick="window.elegirLargo(true)" class="bg-black border border-zinc-700 rounded-xl py-3.5 font-bold">Sí</button>
                        </div>
                    </div>
                </section>

                <!-- PASO 3 · FECHA Y HORA -->
                <section class="step" data-motion>
                    <div class="flex items-center gap-2 mb-6 mt-2">
                        <button onclick="window.goToStep(2)" class="p-2 -ml-2 rounded-full active:bg-zinc-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h1 class="text-2xl font-bold tracking-wide">Fecha y Hora</h1>
                    </div>

                    <label class="text-xs text-zinc-400 mb-2 block uppercase tracking-widest font-semibold">Día</label>
                    <div id="date-selector" class="flex gap-3 overflow-x-auto no-scrollbar pb-2 -mx-1 px-1 mb-8"></div>

                    <label id="time-label" class="text-xs text-zinc-400 mb-3 block uppercase tracking-widest font-semibold hidden">Horarios disponibles</label>
                    <div id="time-slots" class="grid grid-cols-3 gap-3"></div>
                </section>

                <!-- PASO 4 · DATOS -->
                <section class="step" data-motion>
                    <div class="flex items-center gap-2 mb-6 mt-2">
                        <button onclick="window.goToStep(3)" class="p-2 -ml-2 rounded-full active:bg-zinc-800">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h1 class="text-2xl font-bold tracking-wide">Tus Datos</h1>
                    </div>

                    <div id="resumen" class="bg-[#121212] border border-zinc-800 rounded-2xl p-4 mb-6 text-sm"></div>

                    <div class="space-y-5">
                        <div>
                            <label class="text-xs text-zinc-400 mb-2 block uppercase tracking-widest font-semibold">Nombre <span class="text-red-500">*</span></label>
                            <input type="text" id="client-name" placeholder="Nombre completo" autocomplete="name" required>
                        </div>
                        <div>
                            <label class="text-xs text-zinc-400 mb-2 block uppercase tracking-widest font-semibold">Teléfono <span class="text-red-500">*</span></label>
                            <input type="tel" id="client-phone" placeholder="Ej: 1167891234" autocomplete="tel" inputmode="tel" required>
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 w-full p-6 bg-black border-t border-zinc-800 safe-area-bottom hidden" id="confirm-bar">
                        <button id="btn-confirm" class="w-full bg-white text-black font-bold text-lg rounded-xl py-4 hover:bg-zinc-200 transition duration-150 shadow-lg uppercase tracking-wide flex justify-center items-center">
                            Confirmar turno
                        </button>
                        <p id="confirm-error" class="hidden text-center text-sm text-red-400 mt-3"></p>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- PANTALLA DE ÉXITO -->
    <div id="success-screen">
        <div class="check-anim mb-6">
            <svg class="w-24 h-24 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="11" stroke-width="1.5" opacity="0.3"></circle>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 13l3 3 7-7"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold mb-2 tracking-wide">¡Turno confirmado!</h1>
        <p class="text-zinc-400 mb-8">Te esperamos en SB Barber · Dávila 951 💈</p>
        <div id="success-details" class="bg-[#121212] border border-zinc-800 rounded-2xl p-5 w-full max-w-sm text-sm mb-6"></div>
        <a id="cal-btn" href="#" target="_blank" rel="noopener" class="w-full max-w-sm bg-white text-black font-bold text-lg rounded-xl py-4 uppercase tracking-wide mb-3 flex items-center justify-center gap-2">
            📅 Agregar al calendario
        </a>
        <a id="wa-aviso-btn" href="#" target="_blank" rel="noopener" class="w-full max-w-sm text-zinc-400 text-sm py-3 mb-2 underline">
            ¿No podés venir? Avisanos por WhatsApp
        </a>
        <button onclick="location.reload()" class="w-full max-w-sm border border-zinc-700 text-white font-bold rounded-xl py-3 uppercase tracking-wide">
            Sacar otro turno
        </button>
    </div>

    <script>
        /* ===========================================================
           TURNOS ONLINE — el turno queda confirmado solo.
           Horarios libres y reserva: tienda.sbbarber.com.ar/api/push?action=disponibilidad|reservar
           (tienda/lib/turnos.js, que también define barberos, duraciones y horario del local).
           Precios: los de Precios en recepcionista (vía /api/catalogo?pantalla=1, cacheado).
           =========================================================== */
        const API = 'https://tienda.sbbarber.com.ar/api';
        const WHATSAPP_BARBERIA = '541170583352';

        // Mismos barberos y duraciones que tienda/lib/turnos.js (el servidor es el que manda)
        const barberosConfig = [
            { id: 'Santi',  nombre: 'Santi',        duracion: 45, foto: 'santi.jpg' },
            { id: 'SantiF', nombre: 'Santi Flores', duracion: 45, foto: 'santif.jpg' },
            { id: 'Stefa',  nombre: 'Stefa',        duracion: 60, foto: 'stefa.jpg' },
        ];
        const LARGO_EXTRA = 15;
        const SERVICIOS = [
            { id: 'Corte',         nombre: 'Corte',         precio: 20000 },
            { id: 'Corte y Barba', nombre: 'Corte y Barba', precio: 24000 },
            { id: 'Barba',         nombre: 'Barba',         precio: 12000 },
        ];
        let precioPeloLargo = 22000;
        const DIAS_CERRADOS = [0, 1];   // domingo y lunes
        const DIAS_A_MOSTRAR = 14;

        let turnoActual = { barbero: null, servicio: null, largo: false, fecha: null, hora: null };

        const fmtPrecio = n => '$' + Number(n).toLocaleString('es-AR');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
        const duracion = () => turnoActual.barbero.duracion + (turnoActual.largo ? LARGO_EXTRA : 0);
        const precio = () => turnoActual.servicio.id === 'Corte' && turnoActual.largo ? precioPeloLargo : turnoActual.servicio.precio;
        const nombreServicio = () => turnoActual.servicio.nombre + (turnoActual.largo ? ' (pelo largo)' : '');

        function fechaLegible(iso) {
            const [y,m,d] = iso.split('-').map(Number);
            const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            return dias[new Date(y, m-1, d).getDay()]+' '+String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0');
        }

        function ocultarSplash() {
            const splash = document.getElementById('splash-screen');
            const appShell = document.getElementById('app-shell');
            if (appShell) appShell.style.opacity = '1';
            if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 600); }
        }

        window.goToStep = function(n) {
            document.getElementById('main-slider').style.transform = 'translateX('+(-((n-1)*25))+'%)';
            document.getElementById('progress-bar').style.width = (n*25)+'%';
            const confirmBar = document.getElementById('confirm-bar');
            if (n === 4) { renderResumen(); confirmBar.classList.remove('hidden'); }
            else confirmBar.classList.add('hidden');
        };

        function limpiarFechaHora() {
            turnoActual.fecha = null; turnoActual.hora = null;
            document.querySelectorAll('.date-item').forEach(d => d.classList.remove('selected-item'));
            document.getElementById('time-slots').innerHTML = '';
            document.getElementById('time-label').classList.add('hidden');
        }

        function renderBarbers() {
            const barberList = document.getElementById('barber-list');
            barberosConfig.forEach(barbero => {
                const btn = document.createElement('button');
                btn.className = 'bg-[#121212] border border-zinc-800 rounded-2xl p-4 text-left flex items-center gap-5 transition-all duration-150 w-full hover:border-zinc-600 focus:outline-none';
                const avatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(barbero.nombre) + '&background=27272a&color=fff&size=128';
                btn.innerHTML =
                    '<div class="relative shrink-0">'+
                        '<img src="'+barbero.foto+'" alt="'+barbero.nombre+'" data-avatar="'+avatar+'" class="w-16 h-16 rounded-full object-cover border-2 border-zinc-800 shadow-lg bg-zinc-900">'+
                    '</div>'+
                    '<div class="flex flex-col gap-1 w-full">'+
                        '<span class="text-xl font-bold">'+barbero.nombre+'</span>'+
                        '<span class="text-sm text-zinc-400">Martes a sábado · 11:00 a 19:30</span>'+
                    '</div>';
                const img = btn.querySelector('img');
                img.onerror = () => { img.onerror = null; img.src = img.dataset.avatar; };
                btn.onclick = () => {
                    document.querySelectorAll('#barber-list button').forEach(b => b.classList.remove('border-white','bg-zinc-800'));
                    btn.classList.add('border-white','bg-zinc-800');
                    turnoActual = { barbero, servicio: null, largo: false, fecha: null, hora: null };
                    renderServices();
                    limpiarFechaHora();
                    setTimeout(() => window.goToStep(2), 200);
                };
                barberList.appendChild(btn);
            });
        }

        function renderServices() {
            const list = document.getElementById('service-list');
            document.getElementById('largo-box').classList.add('hidden');
            list.innerHTML = '';
            SERVICIOS.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'bg-[#121212] border border-zinc-800 rounded-2xl p-5 flex items-center justify-between transition-all duration-150 w-full hover:border-zinc-600 focus:outline-none text-left';
                btn.innerHTML =
                    '<div class="flex flex-col gap-1">'+
                        '<span class="text-xl font-bold">'+s.nombre+'</span>'+
                        (turnoActual.barbero ? '<span class="text-sm text-zinc-400">'+turnoActual.barbero.duracion+' min</span>' : '')+
                    '</div>'+
                    '<span class="text-lg font-bold shrink-0 ml-3">'+fmtPrecio(s.precio)+'</span>';
                btn.onclick = () => {
                    document.querySelectorAll('#service-list button').forEach(b => b.classList.remove('border-white','bg-zinc-800'));
                    btn.classList.add('border-white','bg-zinc-800');
                    turnoActual.servicio = s;
                    turnoActual.largo = false;
                    limpiarFechaHora();
                    // Barba no depende del largo del pelo; el resto pregunta
                    if (s.id === 'Barba') { setTimeout(() => window.goToStep(3), 200); return; }
                    const box = document.getElementById('largo-box');
                    box.classList.remove('hidden');
                    setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
                };
                list.appendChild(btn);
            });
        }

        window.elegirLargo = (largo) => {
            turnoActual.largo = largo;
            limpiarFechaHora();
            setTimeout(() => window.goToStep(3), 150);
        };

        function renderCustomDatePicker() {
            const dateSelector = document.getElementById('date-selector');
            const diasSemana = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            const hoy = new Date();
            for (let i = 0; i < DIAS_A_MOSTRAR; i++) {
                const f = new Date(hoy); f.setDate(hoy.getDate()+i);
                if (DIAS_CERRADOS.includes(f.getDay())) continue;
                const d = f.getDate(), m = f.getMonth()+1;
                const iso = f.getFullYear()+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
                const btn = document.createElement('button');
                btn.className = 'date-item flex-shrink-0 bg-[#121212] border border-zinc-800 rounded-xl py-3 px-4 flex flex-col items-center justify-center min-w-[65px] transition-all duration-150';
                btn.dataset.date = iso;
                btn.innerHTML = '<span class="text-xs text-zinc-500 uppercase tracking-wider font-semibold">'+diasSemana[f.getDay()]+'</span><span class="text-2xl font-bold mt-1">'+d+'</span>';
                btn.onclick = () => {
                    document.querySelectorAll('.date-item').forEach(d => d.classList.remove('selected-item'));
                    btn.classList.add('selected-item');
                    turnoActual.fecha = iso;
                    turnoActual.hora = null;
                    generarHorarios();
                };
                dateSelector.appendChild(btn);
            }
        }

        let pedidoHoras = 0;
        async function generarHorarios() {
            if (!turnoActual.barbero || !turnoActual.servicio || !turnoActual.fecha) return;
            const timeSlots = document.getElementById('time-slots');
            const timeLabel = document.getElementById('time-label');
            timeSlots.innerHTML = '<div class="col-span-3 text-center text-sm text-zinc-400 py-4">Buscando horarios...</div>';
            timeLabel.classList.remove('hidden');
            const n = ++pedidoHoras; // si toca otro día mientras carga, gana el último
            let horas = [];
            try {
                const q = new URLSearchParams({ action: 'disponibilidad', barbero: turnoActual.barbero.id, fecha: turnoActual.fecha, largo: turnoActual.largo ? '1' : '0' });
                const r = await fetch(API + '/push?' + q);
                const j = await r.json();
                if (!r.ok) throw new Error(j.error);
                horas = j.horas || [];
            } catch (e) {
                if (n !== pedidoHoras) return;
                timeSlots.innerHTML = '<div class="col-span-3 text-center text-sm text-red-400 py-4">No pudimos cargar los horarios. Probá de nuevo.</div>';
                return;
            }
            if (n !== pedidoHoras) return;
            timeSlots.innerHTML = '';
            horas.forEach(horaStr => {
                const btn = document.createElement('button');
                btn.className = 'time-btn border border-zinc-800 bg-[#121212] rounded-xl py-3.5 text-lg font-medium text-center transition-all duration-150';
                btn.innerText = horaStr;
                btn.onclick = () => {
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected-item'));
                    btn.classList.add('selected-item');
                    turnoActual.hora = horaStr;
                    setTimeout(() => window.goToStep(4), 250);
                };
                timeSlots.appendChild(btn);
            });
            if (!horas.length) {
                timeSlots.innerHTML = '<div class="col-span-3 text-center text-sm text-zinc-400 py-4">No quedan horarios libres este día. Probá con otro.</div>';
            }
            setTimeout(() => timeLabel.scrollIntoView({ behavior:'smooth', block:'start' }), 100);
        }

        function filasResumen() {
            const t = turnoActual;
            const fila = (k, v) => '<div class="flex justify-between py-1.5"><span class="text-zinc-400">'+k+'</span><span class="font-semibold">'+v+'</span></div>';
            return fila('Barbero', t.barbero.nombre) + fila('Servicio', nombreServicio()) + fila('Duración', duracion()+' min') +
                fila('Día y hora', fechaLegible(t.fecha)+' · '+t.hora) +
                '<div class="flex justify-between py-1.5 border-t border-zinc-800 mt-2 pt-2"><span class="text-zinc-400">Precio</span><span class="font-bold text-base">'+fmtPrecio(precio())+'</span></div>';
        }

        function renderResumen() {
            const t = turnoActual;
            if (!t.barbero || !t.servicio || !t.fecha || !t.hora) return;
            document.getElementById('resumen').innerHTML = filasResumen();
            document.getElementById('confirm-error').classList.add('hidden');
        }

        // Link para agendarlo en Google Calendar (en el celu abre la app de calendario)
        function linkCalendario() {
            const t = turnoActual;
            const [y, m, d] = t.fecha.split('-').map(Number);
            const [hh, mm] = t.hora.split(':').map(Number);
            const ini = new Date(Date.UTC(y, m - 1, d, hh + 3, mm)); // Argentina = UTC-3
            const fin = new Date(ini.getTime() + duracion() * 60000);
            const f = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
            return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
                action: 'TEMPLATE', text: 'Turno SB Barber · ' + nombreServicio(), dates: f(ini) + '/' + f(fin),
                details: 'Con ' + t.barbero.nombre, location: 'SB Barber, Dávila 951, CABA'
            });
        }

        function mostrarExito(nombre) {
            const t = turnoActual;
            document.getElementById('success-details').innerHTML = filasResumen() +
                '<div class="flex justify-between py-1.5 border-t border-zinc-800 mt-1 pt-2"><span class="text-zinc-400">Cliente</span><span class="font-semibold">'+esc(nombre)+'</span></div>';
            document.getElementById('cal-btn').href = linkCalendario();
            const msg = 'Hola! Tengo turno el '+fechaLegible(t.fecha)+' a las '+t.hora+' con '+t.barbero.nombre+' ('+nombre+') y no voy a poder ir.';
            document.getElementById('wa-aviso-btn').href = 'https://wa.me/'+WHATSAPP_BARBERIA+'?text='+encodeURIComponent(msg);
            const screen = document.getElementById('success-screen');
            screen.style.display = 'flex';
            screen.offsetHeight;
            screen.classList.add('visible');
        }

        function initBotonConfirmar() {
            const nameInput  = document.getElementById('client-name');
            const phoneInput = document.getElementById('client-phone');
            const errorEl    = document.getElementById('confirm-error');
            nameInput.addEventListener('input',  () => nameInput.classList.remove('input-error'));
            phoneInput.addEventListener('input', () => phoneInput.classList.remove('input-error'));

            document.getElementById('btn-confirm').addEventListener('click', async () => {
                const nombre = nameInput.value.trim();
                const tel    = phoneInput.value.replace(/\D/g, '');
                const btn    = document.getElementById('btn-confirm');
                let hayError = false;
                if (nombre.length < 2) { nameInput.classList.add('input-error');  hayError = true; }
                if (tel.length < 8)    { phoneInput.classList.add('input-error'); hayError = true; }
                if (hayError || btn.disabled) return;

                btn.disabled = true; btn.textContent = 'Reservando…';
                errorEl.classList.add('hidden');
                try {
                    const r = await fetch(API + '/push?action=reservar', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            barbero: turnoActual.barbero.id, servicio: turnoActual.servicio.id, largo: turnoActual.largo,
                            fecha: turnoActual.fecha, hora: turnoActual.hora, nombre, telefono: tel
                        })
                    });
                    const j = await r.json().catch(() => ({}));
                    if (!r.ok) throw Object.assign(new Error(j.error || 'No se pudo reservar'), { status: r.status });
                    mostrarExito(nombre);
                } catch (e) {
                    errorEl.textContent = e.message || 'No se pudo reservar. Probá de nuevo.';
                    errorEl.classList.remove('hidden');
                    // Horario ocupado mientras completaba los datos: vuelve a elegir hora
                    if (e.status === 409 && /horario/i.test(e.message)) {
                        setTimeout(() => { window.goToStep(3); generarHorarios(); }, 1800);
                    }
                }
                btn.disabled = false; btn.textContent = 'Confirmar turno';
            });
        }

        // Precios actuales (los de Precios en recepcionista)
        fetch(API + '/catalogo?pantalla=1').then(r => r.json()).then(d => {
            const norm = s => String(s || '').toLowerCase().trim();
            const map = Object.fromEntries((d.servicios || []).map(s => [norm(s.nombre), s.precio]));
            SERVICIOS.forEach(s => { if (map[norm(s.nombre)] != null) s.precio = map[norm(s.nombre)]; });
            if (map['pelo largo'] != null) precioPeloLargo = map['pelo largo'];
            if (document.getElementById('service-list').children.length) renderServices();
        }).catch(() => {});

        document.addEventListener('DOMContentLoaded', () => {
            renderBarbers();
            renderServices();
            renderCustomDatePicker();
            initBotonConfirmar();
            setTimeout(ocultarSplash, 1000);
        });
    </script>
    <script src="../assets/sb-motion.js"></script>
</body>
</html>
